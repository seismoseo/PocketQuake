# PocketQuake conda environment — one command to install all Python deps + libarchive.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate pocketquake
#   pip install -e . -e external/necis-downloader
#   playwright install chromium
#
# This file pins the conda packages PocketQuake itself uses. The deeper deps that
# come transitively from pip-installed sub-packages (eqnet, skhash) are listed in
# requirements.txt; we use both. External compiled binaries (hyp1.40, hypoDD,
# ph2dt, mseed2sac) and the STP Perl client are NOT installable via conda —
# see docs/EXTERNAL_TOOLS.md.
name: pocketquake
channels:
  - conda-forge
dependencies:
  - python=3.11
  # core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  # matplotlib-base is the headless-friendly variant: same matplotlib (Agg/inline
  # backends work in Jupyter / nbconvert), but without the Qt GUI dependency that
  # pulls in qt6-main + 60 MB of X libraries no server needs.
  - matplotlib-base>=3.7
  # seismology
  - obspy>=1.4
  # h5py + tqdm are seisbench deps; install via conda-forge to avoid pip
  # trying to BUILD h5py from source on older systems (would also try to
  # rebuild numpy, which needs GCC >= 9.3 — fails on RHEL 7 / CentOS 7).
  - h5py>=3
  - tqdm
  # NECIS downloader (Playwright drives the JS portal)
  - playwright>=1.40
  - requests>=2.30
  # libarchive provides `bsdtar` for NECIS multi-part ZIP extraction
  - libarchive>=3.7
  # Jupyter (results notebooks)
  - jupyter
  - jupyterlab
  - nbformat>=5.7
  - ipykernel>=6.0
  # Plotly for the results notebook
  - plotly>=5.0
  # PyTorch. conda-forge ships a CPU build by default. GPU is RECOMMENDED for the
  # --python / HypoSVI path: per-event SVGD locate is ~10-20x faster (a 15k-event
  # catalog is ~15 h on GPU vs ~1-2 weeks on CPU). After `conda activate pocketquake`,
  # install a CUDA wheel matching your card from https://pytorch.org/get-started/locally/
  # (e.g. cu128 for Blackwell sm_120). HypoSVI auto-detects the GPU and falls back to
  # CPU, so this is optional — PhaseNet+ and CPU HypoSVI both run fine without it.
  - pytorch>=2.0
  # HypoSVI + EikoNet backend (the --python / --loc-backend hyposvi path) imports these
  # at module load — undeclared deps of those external clones.
  - seaborn>=0.12
  - scikit-learn>=1.2
  # pip-installed packages (no current conda-forge build).
  # kaleido is optional (plotly static image export); pip-install it manually if
  # the results notebook needs PNG exports.
  - pip
  - pip:
      - seisbench>=0.11
      - scikit-fmm>=2023.4.2        # EikoNet/HypoSVI fast-marching travel times
